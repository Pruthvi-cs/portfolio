<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
text{font-family:'JetBrains Mono',monospace}
@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
.card{transform-origin:210px 0;animation:swing 4s ease-in-out infinite}
.glow{animation:glow 3s infinite}
</style>

<rect width="100%" height="100%" fill="#050505"/>
<g class="card">
<rect x="80" y="40" width="260" height="560" rx="22" fill="#111" stroke="#4b4b4b"/>
<image href="./github.jpg" x="125" y="75" width="170" height="170" preserveAspectRatio="xMidYMid slice"/>
<text x="210" y="280" text-anchor="middle" font-size="24" fill="white" font-weight="700">Pruthvi</text>
<text x="210" y="305" text-anchor="middle" font-size="14" fill="#9ca3af">@pruthvi-cs</text>
<text x="210" y="330" text-anchor="middle" font-size="13" fill="#00ff88">Computer Science Student</text>

<text x="100" y="370" fill="#ffffff" font-size="14">Skills</text>
<text x="100" y="395" fill="#bdbdbd" font-size="11">Python • C • C++ • Java</text>
<text x="100" y="415" fill="#bdbdbd" font-size="11">HTML • CSS • JavaScript • React</text>
<text x="100" y="435" fill="#bdbdbd" font-size="11">Git • GitHub • Linux • Docker</text>
<text x="100" y="455" fill="#bdbdbd" font-size="11">Networking • Cyber Security</text>
<text x="100" y="475" fill="#bdbdbd" font-size="11">ESP32 • Arduino • IoT</text>
<text x="100" y="495" fill="#bdbdbd" font-size="11">OpenCV • AI • Machine Learning</text>
<text x="100" y="515" fill="#bdbdbd" font-size="11">Firebase • APIs • SQL</text>

<text x="210" y="565" text-anchor="middle" class="glow" fill="#00ff88" font-size="14">
Building • Breaking • Learning
</text>
</g>
</svg>
